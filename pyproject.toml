[project]
name = "jart"
version = "0.1.0"
description = "JArt：引导式生图引擎（文本 / 图像 → 结构 → 预览 → 生成 → 后处理 → 输出）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pillow>=10.3",
    "pydantic>=2.7",
]

[project.scripts]
jart = "jart.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jart"]

[tool.pytest.ini_options]
testpaths = ["tests"]
